services:
  # ── Backend: Node.js Web Service ──────────────────────
  - type: web
    name: doc2sdk-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false   # Set this manually in the Render dashboard

  # ── Frontend: Static Site ──────────────────────────────
  - type: static
    name: doc2sdk-frontend
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false   # Set to: https://doc2sdk-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
